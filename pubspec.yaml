name: jwenn_met
description: "Jwenn Mèt — find verified skilled workers across Haiti."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management / navigation (MVVM)
  provider: ^6.1.2
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  # Federated sign-in
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # Maps & location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Media & files
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Local persistence / offline cache
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5

  # Misc
  http: ^1.2.2
  intl: ^0.19.0
  url_launcher: ^6.3.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/sample_data/
    - assets/branding/

flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0A6CFF"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"

flutter_native_splash:
  color: "#0A6CFF"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#0A6CFF"
    image: assets/branding/splash_logo.png
